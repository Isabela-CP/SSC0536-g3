name: CI

on:
  push:
    branches:
      - Develop
      - develop
      - main
  pull_request:
    branches:
      - Develop
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Testes do Backend (FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OTO_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes do FastAPI
        run: python -m pytest -v

  frontend-ci:
    name: Testes e Build do Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Executar testes do frontend
        run: npm test

      - name: Buildar o frontend
        run: npm run build
        env:
          VITE_API_MODE: real
          VITE_API_BASE_URL: ${{ vars.OTO_API_URL || 'https://api.example.invalid' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

  docker-smoke:
    name: Docker e persistência após reinício
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir stack isolada
        run: docker compose up -d --build --wait
      - name: Exercitar API e reiniciar processos
        run: python backend/tests/stack_smoke.py
      - name: Diagnóstico
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar recursos descartáveis do CI
        if: always()
        run: docker compose down --volumes
